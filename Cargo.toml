[package]
name = "forge"
version = "0.3.0"
edition = "2021"
authors = ["Forge Contributors"]
license = "MIT OR Apache-2.0"
rust-version = "1.87"

[dependencies]
# Core
winit = "0.30"
wgpu = "29"
hecs = "0.10"
nalgebra = "0.34"

# Spatial
rstar = "0.12.2"

# Parsing
nom = "8"

# UI
egui = "0.34"
egui-wgpu = "0.34"
egui-winit = "0.34"

# Utils
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
pollster = "0.4"
bytemuck = { version = "1.25", features = ["derive"] }

[dev-dependencies]
egui_kittest = "0.34"
wesl = { version = "0.4", features = ["eval"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
